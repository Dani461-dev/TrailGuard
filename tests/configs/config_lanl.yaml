# Konfigurasi dataset LANL (log autentikasi + red team). Dijalankan terpisah dari CERT (lingkungan berbeda).
#   make lanl-toy     -> uji dengan data tiruan
#   python -m trailguard.pipeline all --config configs/config_lanl.yaml --raw data/raw/lanl_sub
project: trailguard
dataset: lanl

io:
  format: csv
explain:
  method: shap
  n_samples: 60
  min_tier: 2
  max_alerts: 300
  top_k: 3

paths:
  raw: data/raw/lanl_toy         # data asli: data/raw/lanl_sub (hasil scripts/prefilter_lanl.py)
  events: data/interim/lanl_events.csv.gz
  labels: data/interim/lanl_labels.csv
  features: data/processed/lanl_features.csv.gz
  model: models/bundle_lanl.joblib
  alerts: outputs/lanl_alerts.jsonl
  metrics: outputs/lanl_metrics.json
  benchmark: outputs/lanl_benchmark.json

ingest:
  max_rows_per_file: null        # batas baris (uji cepat); null = semua baris subset
  chunksize: 2000000
  hash_length: 16

features:
  night_hours: [0, 6]            # proxy 'dini hari' (zona waktu LANL tidak diketahui)
  baseline_window_days: 14
  min_baseline_days: 3

model:
  train_fraction: 0.65
  random_state: 42
  ensemble_weight_supervised: 0.6
  isolation_forest:
    n_estimators: 200

evaluation:
  alert_budget_per_day: 5

policy:
  step_up_threshold: 0.60
  ticket_threshold: 0.85
